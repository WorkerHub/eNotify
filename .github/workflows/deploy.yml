name: Deploy
run-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('Manual deploy by {0}', github.actor) }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      - name: Patch wrangler.toml
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
        run: |
          # Three-state TABLE_PREFIX resolution (must match runtime getTablePrefix):
          # - vars unset or empty → inject "enotify" (default prefix)
          # - vars "none" (reserved word) → inject "" (explicit no prefix)
          # - anything else → inject verbatim
          if [ -z "$TABLE_PREFIX" ]; then
            RESOLVED_PREFIX="enotify"
          elif [ "$TABLE_PREFIX" = "none" ]; then
            RESOLVED_PREFIX=""
          else
            RESOLVED_PREFIX="$TABLE_PREFIX"
          fi
          export RESOLVED_PREFIX

          APP_VERSION="$(node -p "require('../package.json').version")" \
          perl -pi -e '
            s/CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER/$ENV{CLOUDFLARE_ACCOUNT_ID}/g;
            s/D1_DATABASE_NAME_PLACEHOLDER/$ENV{D1_DATABASE_NAME}/g;
            s/D1_DATABASE_ID_PLACEHOLDER/$ENV{D1_DATABASE_ID}/g;
            s/KV_NAMESPACE_ID_PLACEHOLDER/$ENV{KV_NAMESPACE_ID}/g;
            s/TABLE_PREFIX_PLACEHOLDER/$ENV{RESOLVED_PREFIX}/g;
            s/__APP_VERSION__/'\''$ENV{APP_VERSION}'\''/g;
          ' wrangler.toml

      - name: Write secrets file
        working-directory: worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          WAKER_SIGNING_KEY: ${{ secrets.WAKER_SIGNING_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const secrets = {
              JWT_SECRET: process.env.JWT_SECRET,
              SETUP_SECRET: process.env.SETUP_SECRET,
            };

            // Optional waker callback signing key — the only waker-related
            // setting this project has. Only its presence is logged, never its
            // value; the trimmed value is what the receiver verifies with.
            // Same rule as the runtime gate (wakerSigningKey()): a trimmed value
            // ending in _PLACEHOLDER is still a placeholder, i.e. unconfigured.
            const wakerKey = (process.env.WAKER_SIGNING_KEY || "").trim();
            const wakerConfigured =
              wakerKey.length > 0 && !wakerKey.endsWith("_PLACEHOLDER");
            if (wakerConfigured) {
              secrets.WAKER_SIGNING_KEY = wakerKey;
              console.log("WAKER_SIGNING_KEY: configured");
            } else {
              console.log("WAKER_SIGNING_KEY: not configured");
            }

            // Interlock: a waker key and a native Cron Trigger are the only two
            // schedule sources. `wrangler.toml` ships `[triggers] crons = []`
            // (explicitly empty, which is what clears the deployed Cron
            // Trigger), so losing the key as well would silently stop every
            // hourly sweep — fail the deploy instead. Only a non-empty crons
            // list counts: an absent or commented-out key sends no /schedules
            // update at all (Cloudflare keeps the existing trigger).
            const wranglerToml = fs.readFileSync("wrangler.toml", "utf8");
            const triggersHeader = wranglerToml.match(/^\[triggers\]\s*$/m);
            const triggersBody = triggersHeader
              ? wranglerToml
                  .slice(triggersHeader.index + triggersHeader[0].length)
                  .split(/^\[/m)[0]
              : "";
            const cronsList = triggersBody.match(/^crons\s*=\s*\[([\s\S]*?)\]/m);
            // A comment inside the array is not an entry: strip comments before
            // deciding whether the list actually holds a cron expression.
            const cronsEntries = cronsList
              ? cronsList[1].replace(/#[^\n]*/g, "")
              : "";
            const cronsConfigured = /[^,\s]/.test(cronsEntries);
            console.log(
              `native cron: ${cronsConfigured ? "configured" : "disabled"}`,
            );
            if (!wakerConfigured && !cronsConfigured) {
              console.error(
                "neither a Cron Trigger (crons) nor WAKER_SIGNING_KEY is configured: nothing would run",
              );
              process.exit(1);
            }

            fs.writeFileSync(
              process.env.RUNNER_TEMP + "/secrets.json",
              JSON.stringify(secrets),
              { mode: 0o600 },
            );
          '

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
