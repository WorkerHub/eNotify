name = "enotify"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"


[define]
APP_VERSION = "__APP_VERSION__"

[assets]
directory = "../web/dist"
binding = "ASSETS"


[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"

[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[vars]
TABLE_PREFIX = "TABLE_PREFIX_PLACEHOLDER"

# No native Cron Trigger: the hourly reminder sweep is driven by the waker job
# `hourly-reminder-sweep` (see README "定时调度与 waker"). Keep the section and
# empty `crons` instead of deleting it — per Cloudflare docs, removing or
# commenting out the `crons` key does NOT disable an existing Cron Trigger;
# only `crons = []` does (wrangler only PUTs /schedules when `crons` is set).
[triggers]
crons = []


